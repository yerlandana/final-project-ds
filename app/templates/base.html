<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Churn Guard - прогноз оттока клиентов</title>
  <style>
    :root{
      --bg:#0f1419; --card:#1a2029; --line:#2a323d; --text:#e8edf2;
      --muted:#95a3b3; --accent:#3d8bfd; --ok:#2ec27e; --warn:#e5a50a; --bad:#e05252;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
    header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
           border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
    h1{font-size:23px;margin:0;letter-spacing:-.3px}
    h1 span{color:var(--accent)}
    .sub{color:var(--muted);font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:20px;margin-bottom:18px}
    .card h2{font-size:15px;margin:0 0 14px;text-transform:uppercase;
             letter-spacing:.6px;color:var(--muted);font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    select,input{width:100%;background:#131920;color:var(--text);border:1px solid var(--line);
                 border-radius:8px;padding:9px 10px;font-size:14px}
    select:focus,input:focus{outline:none;border-color:var(--accent)}
    button{background:var(--accent);color:#fff;border:0;border-radius:9px;
           padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer}
    button:hover{filter:brightness(1.12)}
    a{color:var(--accent)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
    .muted{color:var(--muted);font-size:13px}
    @media (max-width:520px){ .wrap{padding:18px 14px 46px} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Churn <span>Guard</span></h1>
        <div class="sub">Прогноз оттока клиентов телеком-оператора · ML + AI</div>
      </div>
      <div class="sub">{% block headerinfo %}{% endblock %}</div>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
